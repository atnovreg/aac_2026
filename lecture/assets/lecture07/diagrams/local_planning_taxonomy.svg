<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
<defs>
  <style>
    text { font-family: DejaVu Sans, Arial, sans-serif; fill:#111827; }
    .title { font-size:34px; font-weight:700; }
    .label { font-size:22px; font-weight:700; }
    .small { font-size:18px; }
    .box { fill:#ffffff; stroke:#cbd5e1; stroke-width:3; rx:14; }
    .blue { fill:#eff6ff; stroke:#60a5fa; }
    .green { fill:#ecfdf5; stroke:#34d399; }
    .orange { fill:#fff7ed; stroke:#fb923c; }
    .purple { fill:#faf5ff; stroke:#c084fc; }
  </style>
</defs>
<text x="48" y="62" class="title">Local planning method families</text>
<rect x="70" y="125" width="260" height="390" class="box blue"/>
<text x="105" y="180" class="label">Current AAC</text>
<text x="105" y="225" class="small">front segment crop</text>
<text x="105" y="255" class="small">closest waypoint</text>
<text x="105" y="285" class="small">body transform</text>
<text x="105" y="335" class="small">simple and robust</text>
<text x="105" y="365" class="small">no obstacle avoidance</text>
<rect x="370" y="125" width="260" height="390" class="box green"/>
<text x="405" y="180" class="label">Sampling</text>
<text x="405" y="225" class="small">sample d, T, v</text>
<text x="405" y="255" class="small">polynomial candidates</text>
<text x="405" y="285" class="small">collision and cost</text>
<text x="405" y="335" class="small">fast if candidate set</text>
<text x="405" y="365" class="small">depends on coverage</text>
<rect x="670" y="125" width="260" height="390" class="box orange"/>
<text x="705" y="180" class="label">Numerical</text>
<text x="705" y="225" class="small">optimize path variables</text>
<text x="705" y="255" class="small">constraints/costs</text>
<text x="705" y="285" class="small">MPC / NLP / QP</text>
<text x="705" y="335" class="small">smooth constraints</text>
<text x="705" y="365" class="small">local optimum risk</text>
<rect x="970" y="125" width="240" height="390" class="box purple"/>
<text x="1005" y="180" class="label">RRT / Tree</text>
<text x="1005" y="225" class="small">continuous state</text>
<text x="1005" y="255" class="small">steering function</text>
<text x="1005" y="285" class="small">collision check</text>
<text x="1005" y="335" class="small">explores hard spaces</text>
<text x="1005" y="365" class="small">needs smoothing</text>
</svg>
