<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
<defs>
  <style>
    text { font-family: DejaVu Sans, Arial, sans-serif; fill:#111827; }
    .title { font-size:34px; font-weight:700; }
    .label { font-size:23px; font-weight:700; }
    .small { font-size:18px; }
    .axis { stroke:#111827; stroke-width:5; fill:none; marker-end:url(#arrow); }
    .path { stroke:#22c55e; stroke-width:8; fill:none; }
    .bad { fill:#ef4444; opacity:.7; }
    .box { fill:#ffffff; stroke:#cbd5e1; stroke-width:3; rx:14; }
  </style>
  <marker id="arrow" markerWidth="14" markerHeight="14" refX="10" refY="4" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L10,4 L0,8 z" fill="#111827" />
  </marker>
</defs>
<text x="48" y="62" class="title">Obstacle reasoning in s-t space</text>
<line x1="135" y1="585" x2="1080" y2="585" class="axis"/>
<line x1="135" y1="585" x2="135" y2="125" class="axis"/>
<text x="1095" y="595" class="label">s</text>
<text x="112" y="105" class="label">t</text>
<rect x="420" y="300" width="155" height="210" class="bad"/>
<rect x="710" y="200" width="180" height="240" class="bad"/>
<path d="M150 570 C310 515 390 470 500 250 C590 110 680 125 790 165 C895 205 960 300 1045 530" class="path"/>
<rect x="155" y="635" width="860" height="50" class="box"/>
<text x="185" y="667" class="small">A trajectory is safe if its s(t) curve avoids occupied regions from obstacle prediction.</text>
</svg>
