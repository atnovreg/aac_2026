<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#4f81bd"/>
    </marker>
    <style>
      .title{font:700 34px sans-serif;fill:#1f2d3d}
      .box{fill:#eef5ff;stroke:#4f81bd;stroke-width:3}
      .orange{fill:#fff6e9;stroke:#e67e22;stroke-width:3}
      .green{fill:#edf8f1;stroke:#27ae60;stroke-width:3}
      .label{font:700 23px sans-serif;fill:#1f2d3d}
      .mono{font:18px monospace;fill:#2f3b46}
      .small{font:16px sans-serif;fill:#596672}
    </style>
  </defs>
  <rect width="1280" height="720" fill="#ffffff"/>
  <text class="title" x="60" y="58">2D LiDAR SLAM pipeline</text>

  <rect class="box" x="70" y="180" width="210" height="120" rx="14"/>
  <text class="label" x="125" y="225">LiDAR</text>
  <text class="mono" x="105" y="260">/scan</text>

  <rect class="orange" x="350" y="180" width="230" height="120" rx="14"/>
  <text class="label" x="382" y="225">scan_frame_relay</text>
  <text class="mono" x="390" y="260">/scan_lidar</text>

  <rect class="box" x="650" y="180" width="230" height="120" rx="14"/>
  <text class="label" x="690" y="225">SLAM Toolbox</text>
  <text class="mono" x="690" y="260">scan matching</text>

  <rect class="green" x="950" y="145" width="230" height="190" rx="14"/>
  <text class="label" x="1030" y="190">Outputs</text>
  <text class="mono" x="985" y="230">/map</text>
  <text class="mono" x="985" y="260">map->odom_lidar</text>
  <text class="mono" x="985" y="290">pose graph</text>

  <path d="M285 240 L340 240" stroke="#4f81bd" stroke-width="5" fill="none" marker-end="url(#arrow)"/>
  <path d="M585 240 L640 240" stroke="#4f81bd" stroke-width="5" fill="none" marker-end="url(#arrow)"/>
  <path d="M885 240 L940 240" stroke="#4f81bd" stroke-width="5" fill="none" marker-end="url(#arrow)"/>

  <rect class="orange" x="350" y="430" width="530" height="95" rx="14"/>
  <text class="label" x="420" y="470">odom_tf_publisher</text>
  <text class="mono" x="420" y="502">/odom -> odom_lidar -> base_footprint_lidar</text>
  <path d="M615 425 L715 305" stroke="#e67e22" stroke-width="5" fill="none" marker-end="url(#arrow)"/>

  <rect x="160" y="610" width="960" height="55" rx="12" fill="#f7f9fc" stroke="#cfd8e3"/>
  <text class="mono" x="200" y="645">RViz 확인: Map /map + LaserScan /scan_lidar + TF</text>
</svg>
