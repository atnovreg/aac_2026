<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
<defs>
  <style>
    text { font-family: DejaVu Sans, Arial, sans-serif; fill:#111827; }
    .title { font-size:34px; font-weight:700; }
    .label { font-size:23px; font-weight:700; }
    .small { font-size:18px; }
    .box { fill:#ffffff; stroke:#cbd5e1; stroke-width:3; rx:14; }
    .arrow { stroke:#334155; stroke-width:4; fill:none; marker-end:url(#arrow); }
  </style>
  <marker id="arrow" markerWidth="14" markerHeight="14" refX="10" refY="4" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L10,4 L0,8 z" fill="#334155" />
  </marker>
</defs>
<text x="48" y="62" class="title">Cartesian to Frenet projection</text>
<rect x="85" y="130" width="270" height="145" class="box"/>
<text x="125" y="185" class="label">Vehicle pose</text>
<text x="125" y="225" class="small">(x, y, yaw, v)</text>
<path d="M365 205 H445" class="arrow"/>
<rect x="460" y="105" width="360" height="195" class="box"/>
<text x="500" y="160" class="label">Nearest reference point</text>
<text x="500" y="202" class="small">argmin ||x - r(s)||</text>
<text x="500" y="232" class="small">or heading-aware projection</text>
<text x="500" y="262" class="small">using ordered waypoints</text>
<path d="M830 205 H910" class="arrow"/>
<rect x="925" y="130" width="270" height="145" class="box"/>
<text x="965" y="185" class="label">Frenet state</text>
<text x="965" y="225" class="small">s, d, s_dot, d_dot</text>
<rect x="220" y="430" width="840" height="120" class="box"/>
<text x="260" y="482" class="label">Why projection quality matters</text>
<text x="260" y="522" class="small">A wrong projection causes local planning to begin from the wrong lane segment or wrong direction.</text>
</svg>
