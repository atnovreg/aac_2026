<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#4f81bd"/>
    </marker>
    <style>
      .title{font:700 34px sans-serif;fill:#1f2d3d}
      .box{fill:#eef5ff;stroke:#4f81bd;stroke-width:3}
      .orange{fill:#fff6e9;stroke:#e67e22;stroke-width:3}
      .green{fill:#edf8f1;stroke:#27ae60;stroke-width:3}
      .label{font:700 22px sans-serif;fill:#1f2d3d}
      .mono{font:17px monospace;fill:#2f3b46}
      .small{font:15px sans-serif;fill:#596672}
    </style>
  </defs>
  <rect width="1280" height="720" fill="#ffffff"/>
  <text class="title" x="60" y="58">OpenCV image matching pipeline</text>

  <rect class="box" x="60" y="160" width="190" height="120" rx="14"/>
  <text class="label" x="110" y="205">Map</text>
  <text class="mono" x="85" y="240">track.png</text>
  <rect class="box" x="60" y="420" width="190" height="120" rx="14"/>
  <text class="label" x="115" y="465">BEV</text>
  <text class="mono" x="85" y="500">/ipm_bev/fused</text>

  <rect class="orange" x="330" y="160" width="210" height="120" rx="14"/>
  <text class="label" x="360" y="205">Feature detect</text>
  <text class="mono" x="365" y="240">SIFT / ORB</text>
  <rect class="orange" x="330" y="420" width="210" height="120" rx="14"/>
  <text class="label" x="360" y="465">Feature detect</text>
  <text class="mono" x="365" y="500">SIFT / ORB</text>

  <rect class="green" x="610" y="290" width="220" height="120" rx="14"/>
  <text class="label" x="650" y="335">KNN match</text>
  <text class="mono" x="638" y="370">ratio test</text>

  <rect class="orange" x="900" y="290" width="210" height="120" rx="14"/>
  <text class="label" x="945" y="335">RANSAC</text>
  <text class="mono" x="930" y="370">homography H</text>

  <rect class="green" x="930" y="500" width="250" height="95" rx="14"/>
  <text class="label" x="980" y="540">Pose publish</text>
  <text class="mono" x="960" y="570">x, y, yaw, covariance</text>

  <path d="M255 220 L320 220" stroke="#4f81bd" stroke-width="5" fill="none" marker-end="url(#arrow)"/>
  <path d="M255 480 L320 480" stroke="#4f81bd" stroke-width="5" fill="none" marker-end="url(#arrow)"/>
  <path d="M545 220 C610 230 640 265 680 285" stroke="#4f81bd" stroke-width="5" fill="none" marker-end="url(#arrow)"/>
  <path d="M545 480 C610 470 640 435 680 415" stroke="#4f81bd" stroke-width="5" fill="none" marker-end="url(#arrow)"/>
  <path d="M835 350 L890 350" stroke="#4f81bd" stroke-width="5" fill="none" marker-end="url(#arrow)"/>
  <path d="M1005 415 L1040 490" stroke="#4f81bd" stroke-width="5" fill="none" marker-end="url(#arrow)"/>

  <text class="small" x="625" y="455">lane/non-lane semantic gating이 match 품질을 보조한다.</text>
</svg>
