<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="540" viewBox="0 0 1120 540">
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#455a64"/>
    </marker>
    <style>
      .title{font:700 30px Arial,sans-serif;fill:#263238}
      .label{font:700 18px Arial,sans-serif;fill:#263238}
      .small{font:15px Arial,sans-serif;fill:#455a64}
      .eq{font:700 18px Arial,sans-serif;fill:#1565c0}
      .arrow{stroke:#455a64;stroke-width:3;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1120" height="540" fill="#f7fafc"/>
  <text x="40" y="52" class="title">Curvature-Limited Speed Preview</text>

  <g transform="translate(120 305)">
    <line x1="0" y1="0" x2="650" y2="0" stroke="#cfd8dc" stroke-width="2"/>
    <path d="M20 0 C135 -15, 225 -70, 305 -120 C405 -185, 525 -170, 655 -75" stroke="#27ae60" stroke-width="7" fill="none"/>
    <circle cx="95" cy="-12" r="9" fill="#4caf50"/>
    <circle cx="165" cy="-36" r="11" fill="#7cb342"/>
    <circle cx="235" cy="-77" r="14" fill="#c0ca33"/>
    <circle cx="305" cy="-120" r="18" fill="#f9a825"/>
    <circle cx="380" cy="-156" r="21" fill="#ef6c00"/>
    <circle cx="465" cy="-163" r="17" fill="#f9a825"/>
    <circle cx="560" cy="-126" r="13" fill="#9ccc65"/>

    <path d="M70 42 L430 42" stroke="#c0392b" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="235" y="75" text-anchor="middle" class="label" fill="#c0392b">curvature preview distance</text>

    <rect x="-35" y="-22" width="70" height="44" rx="7" fill="#ffffff" stroke="#4f81bd" stroke-width="3"/>
    <line x1="0" y1="0" x2="70" y2="0" stroke="#4f81bd" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="-40" y="52" class="small">vehicle</text>
  </g>

  <rect x="790" y="125" width="290" height="255" rx="8" fill="#ffffff" stroke="#cfd8dc" stroke-width="2"/>
  <text x="820" y="168" class="eq">a_y = v^2 |kappa|</text>
  <text x="820" y="218" class="eq">v &lt;= sqrt(a_y,max / |kappa|)</text>
  <line x1="820" y1="246" x2="1042" y2="246" stroke="#cfd8dc" stroke-width="2"/>
  <text x="820" y="284" class="small">AAC implementation:</text>
  <text x="820" y="313" class="small">1. sample local path curvature</text>
  <text x="820" y="341" class="small">2. take maximum curvature</text>
  <text x="820" y="369" class="small">3. clamp speed to min/max</text>

  <text x="70" y="492" class="small">Bigger marker means sharper curve. Speed is reduced before entering that curved segment.</text>
</svg>
