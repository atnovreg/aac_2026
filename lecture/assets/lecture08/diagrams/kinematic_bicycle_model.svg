<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="540" viewBox="0 0 1120 540">
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#455a64"/>
    </marker>
    <style>
      .title{font:700 30px Arial,sans-serif;fill:#263238}
      .label{font:700 18px Arial,sans-serif;fill:#263238}
      .small{font:15px Arial,sans-serif;fill:#455a64}
      .eq{font:700 18px Arial,sans-serif;fill:#1565c0}
      .line{stroke:#455a64;stroke-width:3;fill:none}
      .thin{stroke:#90a4ae;stroke-width:2;fill:none}
      .arrow{stroke:#455a64;stroke-width:3;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>

  <rect width="1120" height="540" fill="#f7fafc"/>
  <text x="40" y="52" class="title">Kinematic Bicycle Model</text>

  <g transform="translate(170 100)">
    <line x1="0" y1="300" x2="700" y2="300" class="thin"/>
    <line x1="110" y1="300" x2="520" y2="165" class="thin" stroke-dasharray="8 8"/>

    <g transform="translate(130 260) rotate(-18)">
      <rect x="0" y="-42" width="330" height="84" rx="8" fill="#ffffff" stroke="#4f81bd" stroke-width="3"/>
      <line x1="70" y1="-55" x2="70" y2="55" class="line"/>
      <line x1="260" y1="-55" x2="260" y2="55" class="line"/>
      <circle cx="70" cy="0" r="7" fill="#e67e22"/>
      <circle cx="260" cy="0" r="7" fill="#27ae60"/>
      <text x="70" y="82" text-anchor="middle" class="small">rear axle</text>
      <text x="260" y="-72" text-anchor="middle" class="small">front axle</text>

      <line x1="70" y1="72" x2="260" y2="72" stroke="#263238" stroke-width="2"/>
      <line x1="70" y1="62" x2="70" y2="82" stroke="#263238" stroke-width="2"/>
      <line x1="260" y1="62" x2="260" y2="82" stroke="#263238" stroke-width="2"/>
      <text x="165" y="102" text-anchor="middle" class="label">L</text>

      <g transform="translate(260 0) rotate(-25)">
        <rect x="-9" y="-42" width="18" height="84" rx="5" fill="#263238"/>
      </g>
      <path d="M260 -12 A45 45 0 0 0 302 -44" stroke="#c0392b" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
      <text x="314" y="-50" class="label" fill="#c0392b">delta</text>

      <line x1="70" y1="0" x2="380" y2="0" class="arrow"/>
      <text x="385" y="-10" class="label">v, theta</text>
    </g>

    <circle cx="110" cy="300" r="7" fill="#e67e22"/>
    <text x="88" y="330" class="small">(x, y)</text>

    <path d="M111 300 C185 180, 330 100, 525 66" stroke="#90a4ae" stroke-width="3" fill="none" stroke-dasharray="7 9"/>
    <text x="548" y="73" class="label">turning circle</text>
    <line x1="110" y1="300" x2="520" y2="165" stroke="#b0bec5" stroke-width="2" stroke-dasharray="6 6"/>
    <text x="325" y="220" class="label">R</text>
  </g>

  <rect x="760" y="140" width="300" height="235" rx="8" fill="#ffffff" stroke="#cfd8dc" stroke-width="2"/>
  <text x="790" y="180" class="eq">x_dot = v cos(theta)</text>
  <text x="790" y="218" class="eq">y_dot = v sin(theta)</text>
  <text x="790" y="256" class="eq">theta_dot = v/L tan(delta)</text>
  <text x="790" y="314" class="eq">kappa = tan(delta) / L</text>
  <text x="790" y="352" class="eq">R = 1 / kappa</text>

  <text x="70" y="492" class="small">The controller does not command each wheel. It commands a virtual front steering angle and vehicle speed.</text>
</svg>
