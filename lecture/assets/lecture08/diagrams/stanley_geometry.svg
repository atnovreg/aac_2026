<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="540" viewBox="0 0 1120 540">
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#455a64"/>
    </marker>
    <style>
      .title{font:700 30px Arial,sans-serif;fill:#263238}
      .label{font:700 18px Arial,sans-serif;fill:#263238}
      .small{font:15px Arial,sans-serif;fill:#455a64}
      .eq{font:700 18px Arial,sans-serif;fill:#1565c0}
      .arrow{stroke:#455a64;stroke-width:3;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1120" height="540" fill="#f7fafc"/>
  <text x="40" y="52" class="title">Stanley Controller Geometry</text>

  <g transform="translate(160 330)">
    <line x1="0" y1="0" x2="650" y2="0" stroke="#cfd8dc" stroke-width="2"/>
    <path d="M20 -110 C160 -175, 320 -175, 470 -125 C560 -95, 630 -45, 680 15" stroke="#27ae60" stroke-width="6" fill="none"/>
    <text x="515" y="-130" class="label" fill="#1b5e20">reference path</text>

    <g transform="translate(260 -20) rotate(13)">
      <rect x="-55" y="-28" width="110" height="56" rx="7" fill="#ffffff" stroke="#4f81bd" stroke-width="3"/>
      <line x1="32" y1="-36" x2="32" y2="36" stroke="#4f81bd" stroke-width="3"/>
      <circle cx="32" cy="0" r="7" fill="#e67e22"/>
      <line x1="32" y1="0" x2="145" y2="0" stroke="#4f81bd" stroke-width="3" marker-end="url(#arrow)"/>
      <text x="120" y="-15" class="label">theta</text>
    </g>

    <circle cx="292" cy="-13" r="8" fill="#e67e22"/>
    <text x="255" y="35" class="small">front axle</text>

    <circle cx="275" cy="-151" r="9" fill="#c0392b"/>
    <line x1="292" y1="-13" x2="275" y2="-151" stroke="#c0392b" stroke-width="3" stroke-dasharray="8 6"/>
    <text x="304" y="-88" class="label" fill="#c0392b">e_y</text>

    <line x1="275" y1="-151" x2="385" y2="-146" stroke="#263238" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="390" y="-148" class="label">path heading</text>
    <path d="M334 -142 A55 55 0 0 1 365 -118" stroke="#e67e22" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
    <text x="378" y="-111" class="label" fill="#e67e22">psi_e</text>
  </g>

  <rect x="760" y="125" width="320" height="260" rx="8" fill="#ffffff" stroke="#cfd8dc" stroke-width="2"/>
  <text x="790" y="166" class="eq">delta = psi_e + atan(k e_y / (v + eps))</text>
  <line x1="790" y1="192" x2="1045" y2="192" stroke="#cfd8dc" stroke-width="2"/>
  <text x="790" y="230" class="small">psi_e: heading error</text>
  <text x="790" y="258" class="small">e_y: signed cross-track error</text>
  <text x="790" y="286" class="small">k: cross-track gain</text>
  <text x="790" y="314" class="small">v: speed, eps avoids division by zero</text>
  <text x="790" y="352" class="small">then clamp delta to steering limit</text>

  <text x="70" y="492" class="small">Stanley pulls the front axle toward the path and aligns the vehicle heading with the path tangent.</text>
</svg>
