<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#4f81bd"/>
    </marker>
    <style>
      .title{font:700 34px sans-serif;fill:#1f2d3d}
      .box{fill:#eef5ff;stroke:#4f81bd;stroke-width:3}
      .box2{fill:#fff6e9;stroke:#e67e22;stroke-width:3}
      .box3{fill:#edf8f1;stroke:#27ae60;stroke-width:3}
      .label{font:700 24px sans-serif;fill:#1f2d3d}
      .mono{font:19px monospace;fill:#2f3b46}
      .text{font:18px sans-serif;fill:#2f3b46}
    </style>
  </defs>
  <rect width="1280" height="720" fill="#ffffff"/>
  <text class="title" x="60" y="58">colcon build 결과가 어디에 생기는가</text>

  <rect class="box" x="70" y="170" width="250" height="150" rx="14"/>
  <text class="label" x="125" y="220">src/</text>
  <text class="mono" x="100" y="260">package.xml</text>
  <text class="mono" x="100" y="292">CMakeLists.txt</text>

  <rect class="box2" x="390" y="170" width="250" height="150" rx="14"/>
  <text class="label" x="445" y="220">build/</text>
  <text class="text" x="425" y="260">compile 중간 결과</text>
  <text class="text" x="425" y="292">CMake cache</text>

  <rect class="box3" x="710" y="170" width="250" height="150" rx="14"/>
  <text class="label" x="765" y="220">install/</text>
  <text class="text" x="745" y="260">실행 가능한 overlay</text>
  <text class="mono" x="745" y="292">setup.bash</text>

  <rect class="box" x="1030" y="170" width="180" height="150" rx="14"/>
  <text class="label" x="1082" y="220">ros2</text>
  <text class="mono" x="1068" y="260">run</text>
  <text class="mono" x="1058" y="292">launch</text>

  <path d="M325 245 L380 245" stroke="#4f81bd" stroke-width="5" marker-end="url(#arrow)"/>
  <path d="M645 245 L700 245" stroke="#4f81bd" stroke-width="5" marker-end="url(#arrow)"/>
  <path d="M965 245 L1020 245" stroke="#4f81bd" stroke-width="5" marker-end="url(#arrow)"/>

  <rect x="130" y="410" width="1020" height="70" rx="12" fill="#f7f9fc" stroke="#cfd8e3"/>
  <text class="mono" x="170" y="454">colcon build --base-paths src/* --packages-select example_cpp_node</text>

  <rect x="130" y="510" width="1020" height="70" rx="12" fill="#f7f9fc" stroke="#cfd8e3"/>
  <text class="mono" x="170" y="554">source /ros_ws/install/setup.bash</text>

  <rect x="130" y="610" width="1020" height="55" rx="12" fill="#fff6e9" stroke="#e67e22"/>
  <text class="text" x="170" y="644">source를 잊으면 방금 빌드한 package/executable을 ROS 2 CLI가 찾지 못한다.</text>
</svg>
