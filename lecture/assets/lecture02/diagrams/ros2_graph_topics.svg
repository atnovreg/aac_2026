<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#596672"/>
    </marker>
    <style>
      .title{font:700 34px sans-serif;fill:#1f2d3d}
      .node{fill:#eef5ff;stroke:#4f81bd;stroke-width:3}
      .topic{fill:#fff6e9;stroke:#e67e22;stroke-width:3}
      .msg{fill:#edf8f1;stroke:#27ae60;stroke-width:3}
      .label{font:700 25px sans-serif;fill:#1f2d3d}
      .text{font:20px sans-serif;fill:#2f3b46}
      .mono{font:19px monospace;fill:#2f3b46}
      .small{font:16px sans-serif;fill:#596672}
    </style>
  </defs>
  <rect width="1280" height="720" fill="#ffffff"/>
  <text class="title" x="60" y="58">ROS 2 Graph: node가 topic으로 연결된다</text>

  <rect class="node" x="90" y="170" width="280" height="130" rx="14"/>
  <text class="label" x="145" y="220">publisher node</text>
  <text class="mono" x="125" y="260">example_cpp_node</text>

  <rect class="topic" x="500" y="170" width="280" height="130" rx="14"/>
  <text class="label" x="590" y="220">topic</text>
  <text class="mono" x="575" y="260">/uam_model</text>

  <rect class="node" x="910" y="170" width="280" height="130" rx="14"/>
  <text class="label" x="960" y="220">subscriber</text>
  <text class="mono" x="990" y="260">RViz / CLI</text>

  <path d="M375 235 L490 235" stroke="#596672" stroke-width="5" marker-end="url(#arrow)"/>
  <text class="small" x="405" y="218">publish</text>
  <path d="M785 235 L900 235" stroke="#596672" stroke-width="5" marker-end="url(#arrow)"/>
  <text class="small" x="810" y="218">subscribe</text>

  <rect class="msg" x="390" y="400" width="500" height="155" rx="14"/>
  <text class="label" x="505" y="448">message type</text>
  <text class="mono" x="485" y="490">visualization_msgs/msg/Marker</text>
  <text class="text" x="445" y="530">header, pose, scale, color, type</text>

  <path d="M640 305 L640 390" stroke="#27ae60" stroke-width="5" marker-end="url(#arrow)"/>
  <text class="small" x="660" y="355">type contract</text>

  <rect x="120" y="605" width="1040" height="55" rx="12" fill="#f7f9fc" stroke="#cfd8e3"/>
  <text class="text" x="160" y="640">확인 명령: ros2 node list · ros2 topic list · ros2 topic info /uam_model --verbose</text>
</svg>
