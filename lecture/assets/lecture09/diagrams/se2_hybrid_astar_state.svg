<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="540" viewBox="0 0 1120 540">
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#455a64"/>
    </marker>
    <style>
      .title{font:700 30px Arial,sans-serif;fill:#263238}
      .label{font:700 18px Arial,sans-serif;fill:#263238}
      .small{font:15px Arial,sans-serif;fill:#455a64}
      .eq{font:700 18px Arial,sans-serif;fill:#1565c0}
      .grid{stroke:#cfd8dc;stroke-width:1}
      .arrow{stroke:#455a64;stroke-width:3;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1120" height="540" fill="#f7fafc"/>
  <text x="40" y="52" class="title">Hybrid A*: Discrete Keys, Continuous Poses</text>

  <g transform="translate(95 105)">
    <rect x="0" y="0" width="460" height="330" fill="#ffffff" stroke="#90a4ae" stroke-width="2"/>
    <g>
      <line x1="46" y1="0" x2="46" y2="330" class="grid"/>
      <line x1="92" y1="0" x2="92" y2="330" class="grid"/>
      <line x1="138" y1="0" x2="138" y2="330" class="grid"/>
      <line x1="184" y1="0" x2="184" y2="330" class="grid"/>
      <line x1="230" y1="0" x2="230" y2="330" class="grid"/>
      <line x1="276" y1="0" x2="276" y2="330" class="grid"/>
      <line x1="322" y1="0" x2="322" y2="330" class="grid"/>
      <line x1="368" y1="0" x2="368" y2="330" class="grid"/>
      <line x1="414" y1="0" x2="414" y2="330" class="grid"/>
      <line x1="0" y1="55" x2="460" y2="55" class="grid"/>
      <line x1="0" y1="110" x2="460" y2="110" class="grid"/>
      <line x1="0" y1="165" x2="460" y2="165" class="grid"/>
      <line x1="0" y1="220" x2="460" y2="220" class="grid"/>
      <line x1="0" y1="275" x2="460" y2="275" class="grid"/>
    </g>
    <circle cx="185" cy="165" r="9" fill="#4f81bd"/>
    <line x1="185" y1="165" x2="255" y2="125" class="arrow"/>
    <text x="265" y="125" class="label">continuous pose</text>
    <text x="180" y="196" text-anchor="middle" class="small">(x, y, yaw)</text>
    <rect x="138" y="110" width="46" height="55" fill="#e3f2fd" opacity="0.65"/>
    <text x="60" y="356" class="small">grid cell key: ix, iy</text>
    <text x="260" y="356" class="small">heading key: yaw bin</text>
  </g>

  <rect x="650" y="120" width="390" height="250" rx="8" fill="#ffffff" stroke="#cfd8dc" stroke-width="2"/>
  <text x="680" y="160" class="eq">state = (x, y, theta)</text>
  <text x="680" y="210" class="eq">key = f(ix, iy, yaw_bin)</text>
  <line x1="680" y1="238" x2="1010" y2="238" stroke="#cfd8dc" stroke-width="2"/>
  <text x="680" y="278" class="small">Search is discrete enough to close states.</text>
  <text x="680" y="306" class="small">Propagation keeps vehicle motion continuous.</text>
  <text x="680" y="334" class="small">This is why it is called Hybrid A*.</text>

  <text x="70" y="492" class="small">A 2D grid cell alone is not enough for parking; the same cell with different heading can require a different maneuver.</text>
</svg>
