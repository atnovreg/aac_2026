session_name: AAC_2026
windows:
  - window_name: Autonomy
    layout: tiled
    shell_command_before:
      - source /opt/ros/humble/setup.bash
      - source /ros_ws/install/setup.bash
      - cd /ros_ws/src/aac_2026
    panes:
    - shell_command:
      - exec ros2 launch static_tf_tree static_tf_tree.launch.py
    - shell_command:
      - exec ros2 launch aac_vehicle spawn_vehicle.launch.py
    - shell_command:
      - ros2 launch joy_control_node joy_control.launch.py
    - shell_command:
      - ros2 launch ipm_bev_node deploy.launch.py
    - shell_command:
      - ros2 launch image_match_node opencv.launch.py
    - shell_command:
      - ros2 launch aac_vehicle slam_mapping.launch.py use_sim_time:=true
    - shell_command:
      - ros2 launch track_path_publisher track_path_publisher.launch.py
    - shell_command:
      - ros2 launch local_path_planner_node local_path_planner.launch.py
    - shell_command:
      - ros2 launch stanley_node stanley.launch.py
    - shell_command:
      - exec rviz2 -d /ros_ws/src/aac_2026/rviz/planner.rviz
