# Entry point: bash start.sh [autonomy|prepare]. Settings: jetson.env.
session_name: AAC_2026
start_directory: ../..
before_script: ./jetson.sh
environment:
  AAC_RUN_MODE: ${AAC_RUN_MODE}
  AAC_SETTINGS: ${AAC_SETTINGS}
  AAC_RUN_DIR: ${AAC_RUN_DIR}
options:
  remain-on-exit: 'on'
windows:
  - window_name: Vehicle
    panes:
      - shell_command: exec bash operations/tmuxp_config/jetson.sh vehicle
  - window_name: Lidar
    panes:
      - shell_command: exec bash operations/tmuxp_config/jetson.sh lidar
  - window_name: Localization
    panes:
      - shell_command: exec bash operations/tmuxp_config/jetson.sh localization
  - window_name: MPCC
    panes:
      - shell_command: exec bash operations/tmuxp_config/jetson.sh controller
  - window_name: Record
    layout: tiled
    panes:
      - shell_command: exec bash operations/tmuxp_config/jetson.sh record-sensors
      - shell_command: exec bash operations/tmuxp_config/jetson.sh record-vehicle
  - window_name: Monitor
    panes:
      - shell_command: exec bash operations/tmuxp_config/jetson.sh monitor
