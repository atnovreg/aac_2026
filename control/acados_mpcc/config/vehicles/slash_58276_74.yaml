assumptions:
  length: 0.578m conservative footprint; listings differ 568 vs 578mm, user measurement
    pending
  width: 0.296m provisional overall envelope from published track/width listings;
    not measured wheel-center track
  mass: 3.56kg retained as unmeasured simulation assumption. Candidate battery+LiDAR+computer
    subtotal is 0.783kg; full build needs remaining and removed component masses.
  cg: centered between axles; exact axle weight distribution unknown
  yaw_inertia: mass*(length^2+width^2)/12 uniform rectangular body approximation
  tire_radius: nominal 109mm diameter; loaded radius unknown
  battery: user confirmed planned 3S nominal 11.1V battery; no voltage sag modeled
  current: Equivalent +/-30A retained by user permission for approximate simulation;
    not a factory default or the per-channel 100A advertised hardware rating.
  torque_constant: 60/(2*pi*Kv) ideal equivalent-current convention; actual VESC FOC
    current mapping needs calibration
  drive: stock gearing assumed; 80 percent efficiency; smooth voltage-limited traction
    envelope, not measured motor curve
  tires: generic tanh lateral force with mu=0.9 and normalized stiffness 6/rad; not
    copied ORCA tire parameters
  resistance: estimated rolling coefficient and quadratic aerodynamic force
  steering: estimated road-wheel limit 0.45rad and command rate 2.5rad/s; ideal response
    with no servo lag
limitations:
- no vertical motion
- no suspension or load transfer
- no tire temperature
- no wheel-speed/slip dynamics
- no VESC electrical transient or thermal model
- no localization noise or latency
- not a calibrated high-speed model
- Negative normalized motor input models braking only, not reverse drive; battery
  regen/current and electrical transients are not represented.
