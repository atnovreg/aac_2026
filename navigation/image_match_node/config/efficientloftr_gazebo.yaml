efficientloftr_localization:
  ros__parameters:
    use_sim_time: true

    image_topic: /ipm_bev/fused
    map_image_path: ""

    model_id: zju-community/efficientloftr
    cache_dir: /ros_ws/src/aac_2026/.hf_home/hub
    local_files_only: false
    device: cuda
    use_amp: true

    # RTX 5080에서 매 프레임 처리하기보다 최신 프레임 위주로 처리합니다.
    frame_stride: 3
    match_threshold: 0.2
    min_matches: 40
    min_inliers: 20
    min_inlier_ratio: 0.2
    ransac_reproj_threshold: 4.0
    forward_probe_distance: 1.0

    # simple_track.world의 box 크기: X 12 m, Y 16 m.
    map_x_min: -6.0
    map_x_max: 6.0
    map_y_min: -8.0
    map_y_max: 8.0

    # Gazebo texture U축은 world Y축과 반대 방향.
    map_swap_xy: true
    map_flip_x: true
    map_flip_y: true

    # ipm_bev_node 기본 출력 범위.
    bev_x_min: -10.0
    bev_x_max: 10.0
    bev_y_min: -6.0
    bev_y_max: 6.0

    map_frame: map
    child_frame: base_footprint
    publish_tf: true

    pose_topic: /visual_localization/pose
    debug_topic: /visual_localization/debug_matches
    homography_topic: /visual_localization/homography
    match_count_topic: /visual_localization/match_count
    inlier_ratio_topic: /visual_localization/inlier_ratio
    max_debug_matches: 120
    debug_height: 720
