opencv_localization:
  ros__parameters:
    use_sim_time: true

    image_topic: /ipm_bev/fused
    map_image_path: ""

    # feature_type: sift | orb | akaze
    feature_type: sift
    max_features: 6000
    ratio_test: 0.72
    use_clahe: true
    frame_stride: 1
    min_matches: 12
    min_inliers: 8
    min_inlier_ratio: 0.25
    homography_method: usac_magsac  # usac_magsac | ransac
    ransac_reproj_threshold: 5.0
    forward_probe_distance: 1.0

    # Detect features once, classify them with the lane mask, then only match
    # lane-to-lane and non-lane-to-non-lane descriptors.
    enable_lane_features: true
    lane_ratio_test: 0.75
    lane_max_matches: 100
    lane_hsv_lower: [0, 0, 165]
    lane_hsv_upper: [179, 80, 255]
    lane_roi_y_min_ratio: 0.0
    lane_roi_y_max_ratio: 1.0
    lane_kernel_size: 5
    lane_open_iterations: 0
    lane_close_iterations: 1
    # Ratios override the pixel fallbacks above so map/BEV processing scales
    # with image resolution.
    lane_min_area: 20
    lane_kernel_size_ratio: 0.006
    lane_min_area_ratio: 0.00005
    lane_feature_dilation_ratio: 0.02
    # Replace sparse semantic matches with one global SIFT match set.
    enable_global_match_fallback: true

    # Experimental: enable after semantic matching is validated on a bag.
    enable_chamfer_refinement: false
    chamfer_max_pts: 400
    chamfer_score_gate: 20.0
    chamfer_min_coverage: 0.8
    chamfer_outside_penalty: 30.0
    chamfer_min_improvement: 0.25
    chamfer_max_translation_px: 20.0
    chamfer_max_rotation_deg: 5.0

    map_x_min: -5.5
    map_x_max: 5.5
    map_y_min: -8.0
    map_y_max: 8.0
    # Gazebo texture UV:
    # image u increasing -> world -Y, image v decreasing -> world +X
    map_swap_xy: true
    map_flip_x: true
    map_flip_y: true

    bev_x_min: -10.0
    bev_x_max: 10.0
    bev_y_min: -6.0
    bev_y_max: 6.0

    map_frame: map
    child_frame: base_footprint_opencv
    publish_tf: false

    pose_topic: /visual_localization/opencv/pose
    odometry_topic: /visual_localization/opencv/odometry
    debug_topic: /visual_localization/opencv/debug_matches
    homography_topic: /visual_localization/opencv/homography
    match_count_topic: /visual_localization/opencv/match_count
    lane_match_count_topic: /visual_localization/opencv/lane_match_count
    lane_inlier_count_topic: /visual_localization/opencv/lane_inlier_count
    inlier_ratio_topic: /visual_localization/opencv/inlier_ratio
    max_debug_matches: 120
    debug_height: 720
