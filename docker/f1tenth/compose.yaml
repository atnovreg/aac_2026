name: aac-f1tenth
x-assets: &assets
  - ${F1TENTH_WS:-../../../..}:/ws
  - type: bind
    source: ${F1TENTH_WS:-../../../..}/bag
    target: /ws/bag
    read_only: true
    bind:
      create_host_path: false
  - type: bind
    source: ${F1TENTH_WS:-../../../..}/tracks
    target: /ws/tracks
    read_only: true
    bind:
      create_host_path: false
  - type: bind
    source: ${F1TENTH_WS:-../../../..}/results
    target: /ws/results
    bind:
      create_host_path: false
  - /tmp/.X11-unix:/tmp/.X11-unix:ro
services:
  fastlio:
    build:
      context: ${F1TENTH_WS:-../../../..}
      dockerfile: src/aac_2026/docker/f1tenth/Dockerfile
    image: aac-f1tenth-fastlio:jazzy
    working_dir: /ws
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    environment:
      HOME: /tmp/aac-fastlio-home
      ROS_DOMAIN_ID: "${ROS_DOMAIN_ID:-42}"
      USE_SIM_TIME: "${USE_SIM_TIME:-false}"
      ROS_AUTOMATIC_DISCOVERY_RANGE: LOCALHOST
      DISPLAY: "${DISPLAY:-}"
      QT_X11_NO_MITSHM: "1"
    volumes: *assets
    shm_size: 1gb
    stdin_open: true
    tty: true
  track:
    extends:
      service: fastlio
    image: aac-f1tenth-track:jazzy
    build:
      context: ${F1TENTH_WS:-../../../..}
      dockerfile: src/aac_2026/docker/f1tenth/Dockerfile.track
    command: ["python3", "-m", "planning.track_pipeline"]
  acados:
    build:
      context: ${F1TENTH_WS:-../../../..}
      dockerfile: src/aac_2026/docker/f1tenth/Dockerfile.acados
    image: aac-f1tenth-acados:0.6.0
    working_dir: /ws
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    volumes: *assets
    environment:
      PYTHONPATH: /ws/src/aac_2026
      MPLCONFIGDIR: /tmp/aac-acados-matplotlib
    command: ["python", "-m", "control.acados_mpcc", "--help"]
  gazebo:
    build:
      context: ${F1TENTH_WS:-../../../..}
      dockerfile: src/aac_2026/docker/f1tenth/Dockerfile.gazebo
    image: aac-f1tenth-gazebo:harmonic
    working_dir: /ws
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    environment:
      PYTHONPATH: /ws/src/aac_2026
      DISPLAY: "${DISPLAY:-:0}"
      XAUTHORITY: /tmp/gazebo.Xauthority
      LIBGL_ALWAYS_SOFTWARE: "${LIBGL_ALWAYS_SOFTWARE:-1}"
      GZ_PARTITION: aac_f1tenth_replay
    devices:
      - /dev/dri:/dev/dri
    volumes: *assets
    shm_size: 1gb
    command: ["gz", "sim", "--help"]
