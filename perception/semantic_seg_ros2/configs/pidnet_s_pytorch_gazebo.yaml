backend: pidnet_s

model:
  # Official PIDNet submodule source checkout:
  #   git submodule update --init --recursive perception/PIDNet
  #
  # The official PyTorch checkpoint is distributed through Google Drive and may
  # require manual browser download. See the README before using this config.
  source_path: /ros_ws/src/aac_2026/perception/PIDNet
  checkpoint: /ros_ws/src/aac_2026/perception/PIDNet/pretrained_models/cityscapes/PIDNet_S_Cityscapes_test.pt
  model_name: pidnet_s
  num_classes: 19
  device: cuda:0
  input_size: [512, 1024]  # [height, width]
  mean: [0.485, 0.456, 0.406]
  std: [0.229, 0.224, 0.225]
  align_corners: true
  class_names:
    - road
    - sidewalk
    - building
    - wall
    - fence
    - pole
    - traffic light
    - traffic sign
    - vegetation
    - terrain
    - sky
    - person
    - rider
    - car
    - truck
    - bus
    - train
    - motorcycle
    - bicycle

output:
  # Cityscapes pretrained models label road as class 0. Lane markings are not a
  # separate Cityscapes class, so train a custom 3-class model if lane masks are required.
  drivable_class_ids: [0]
  lane_class_ids: []
